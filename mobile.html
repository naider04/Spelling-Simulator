<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Practice</title>
</head>

<body>

<h2>Word:</h2>
<div id="word">-</div>

<h3>Attempts (combined):</h3>
<ul id="misspellList"></ul>

<p id="liveTranscription">Ready</p>
<p id="heard">Press Start</p>

<button id="startMicBtn">Start</button>
<button id="manualNewWordBtn">New Word</button>
<button id="deleteBtn">Delete</button>

<script>
// -------- WORD LIST --------
const words = [
    "Accurate", "Acknowledgment", "Acquaintance", "Activity", "Adventure", "Always",
    "Ambiguous", "Answer", "Anxious", "Apprehensive", "Architecture", "Articulate",
    "Assertive", "Assimilate", "Astonishing", "Autonomous", "Balance", "Benevolent",
    "Between", "Biochemistry", "Book", "Bored", "Bottle", "Boy", "Break", "Brevity",
    "Calendar", "Camouflage", "Capricious", "Career", "Challenge",
    "Children", "Close", "Coherence", "Colloquial", "Complete", "Compliance",
    "Computer", "Conscientious", "Control", "Controversial",
    "Convoluted", "Country", "Curious", "Decide", "Dehydration",
    "Dilemma", "Disappearance", "Discover", "Discrepancy", "Divulge", "Eloquent",
    "Embarrassing", "Empirical", "Encounter", "Energy", "Enigmatic", "Environmentally",
    "Ephemeral", "Exaggeration", "Face", "Fairness", "Famous", "Father", "Feel",
    "Filmmaker", "Finger", "Flabbergasted", "Flower", "Focus", "Foster", "Friend",
    "Gate", "Gather", "Handkerchief", "Help", "Honest", "Hypothetical",
    "Imagine", "Impeccable", "Importune", "Improve", "Independence", "Indispensable",
    "Ineffable", "Irreplaceable", "Journey", "Judgemental", "Knowledge", "Knowledgeable",
    "Language", "Look", "Make", "Member", "Message", "Meticulous", "Misunderstood",
    "Monday", "Movie", "Nature", "Near", "Neighborhood", "Night", "Notebook", "Notice",
    "Observe", "Obsolete", "Often", "Outside", "Overwhelming", "Package", "Paradox",
    "Patient", "Pencil", "People", "Perfect", "Perseverance", "Plausible", "Play",
    "Please", "Popular", "Potato", "Practice", "Pragmatic", "Predicament", "Prepare",
    "Present", "Protect", "Provide", "Psychologist", "Quarantine", "Quickly", "Reason",
    "Recommendable", "Redundant", "Reiterate", "Resilient", "Respect", "Result", "Rich",
    "School", "Secret", "Serious", "Shoes", "Small", "Sophisticated", "Speak", "Special",
    "Spontaneous", "Spoon", "Sport", "Strong", "Student", "Subtle", "Suggest", "Talent",
    "Taxonomy", "Teacher", "Think", "Travel", "Tree", "Unbelievable", "Unnecessary",
    "Useful", "Vacation", "Wash", "Water", "Welcome", "Wisdom", "Yesterday"
  ];

let currentWord = getRandomWord();
let recognition = null;
let resetGuard = false;

let accumulatedSpelling = "";

const wordElement = document.getElementById("word");
const heardElement = document.getElementById("heard");
const liveTranscriptionElement = document.getElementById("liveTranscription");
const misspellListEl = document.getElementById("misspellList");

function getRandomWord() {
  return words[Math.floor(Math.random() * words.length)];
}

// -------- DISPLAY --------
function renderMistakeLog() {
  misspellListEl.innerHTML = "";

  if (!accumulatedSpelling.trim()) {
    misspellListEl.innerHTML = "<li>No attempts</li>";
    return;
  }

  let li = document.createElement("li");
  li.innerText = accumulatedSpelling.trim();
  misspellListEl.appendChild(li);
}

// -------- RESET --------
function resetMistakeHistory() {
  accumulatedSpelling = "";
  renderMistakeLog();
}

// -------- NORMALIZE --------
function normalizeText(str) {
  return str.toLowerCase().replace(/[^a-z]/g, '').trim();
}

// -------- PHONETIC MATCH --------
function getConfusionGroup(letter) {
  const groups = {
    'b': ['b','p','v','d'],
    'p': ['p','b','v','d'],
    'v': ['v','b','p','d'],
    'd': ['d','t','v','b'],
    't': ['t','d'],
    'm': ['m','n'],
    'n': ['n','m'],
    'f': ['f','v'],
    'c': ['c','k','q'],
    'k': ['k','c','q'],
    'q': ['q','c','k'],
    's': ['s','z'],
    'z': ['z','s'],
    'g': ['g','j'],
    'j': ['j','g']
  };
  return groups[letter] || [letter];
}

function isSimilarLetter(a, b) {
  return a === b || getConfusionGroup(a).includes(b);
}

function compareLetterSequences(spoken, target) {
  if (spoken.length !== target.length) return false;
  for (let i = 0; i < spoken.length; i++) {
    if (!isSimilarLetter(spoken[i], target[i])) return false;
  }
  return true;
}

function isSpellingMatch(transcript, targetWord) {
  let spoken = normalizeText(transcript).split('');
  let target = targetWord.toLowerCase().split('');
  return compareLetterSequences(spoken, target);
}

// -------- HANDLERS --------
function onCorrect() {
  resetMistakeHistory();
  heardElement.innerText = "Correct!";
  currentWord = getRandomWord();
  wordElement.innerText = currentWord;

  if (recognition) recognition.stop();

  setTimeout(() => {
    if (!resetGuard) startListening();
  }, 400);
}

function clearAccumulated() {
  accumulatedSpelling = "";
  renderMistakeLog();
  heardElement.innerText = "Cleared";
}

function onWrong(spoken) {
  if (!spoken) return;

  let clean = spoken.toLowerCase().replace(/[^a-z\s]/g, '');
  accumulatedSpelling = (accumulatedSpelling + " " + clean).trim();

  renderMistakeLog();
  heardElement.innerText = "Wrong";
}

// -------- SPEECH --------
function startListening() {
  if (resetGuard) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    heardElement.innerText = "Not supported";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onresult = (event) => {
    let final = "";
    let interim = "";

    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }

    liveTranscriptionElement.innerText = interim + final;

    if (final) {
      let spoken = final.trim();
      let cleanSpoken = spoken.toLowerCase().replace(/[^a-z\s]/g, '');

      let combined = (accumulatedSpelling + " " + cleanSpoken).trim();

      if (isSpellingMatch(combined, currentWord)) {
        recognition.stop();
        onCorrect();
      } else {
        onWrong(spoken);
        recognition.stop();
      }
    }
  };

  recognition.onend = () => {
    if (!resetGuard) {
      setTimeout(() => {
        try { recognition.start(); } catch(e) {}
      }, 200);
    }
  };

  recognition.start();
}

// -------- BUTTONS --------
document.getElementById("startMicBtn").onclick = startListening;
document.getElementById("deleteBtn").onclick = clearAccumulated;

document.getElementById("manualNewWordBtn").onclick = () => {
  resetGuard = true;

  if (recognition) recognition.stop();

  resetMistakeHistory();
  currentWord = getRandomWord();
  wordElement.innerText = currentWord;

  resetGuard = false;
};

// -------- INIT --------
wordElement.innerText = currentWord;
renderMistakeLog();

</script>

</body>
</html>
