<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spelling Practice</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    #word {
      font-size: 50px;
      margin: 20px;
    }
    #heard {
      font-size: 22px;
      margin-top: 20px;
      color: #333;
    }
    button {
      margin-top: 20px;
      font-size: 18px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

<h1>Spell the Word</h1>

<div id="word"></div>
<div id="heard">🎤 Listening...</div>

<button onclick="resetListening()">🔄 Reset</button>

<script>

// ================= WORD LIST =================
const words = [
  "accurate","acknowledgment","acquaintance","activity","adventure","always",
  "ambiguous","answer","anxious","apprehensive","architecture","articulate",
  "assertive","assimilate","astonishing","autonomous","balance","benevolent",
  "between","biochemistry","book","bored","bottle","boy","break","brevity",
  "calendar","camouflage","capricious","career","challenge","children","close",
  "coherence","colloquial","complete","compliance","computer","conscientious",
  "control","controversial","convoluted","country","curious","decide",
  "dehydration","dilemma","disappearance","discover","discrepancy","divulge",
  "eloquent","embarrassing","empirical","encounter","energy","enigmatic",
  "environmentally","ephemeral","exaggeration","face","fairness","famous",
  "father","feel","filmmaker","finger","flabbergasted","flower","focus",
  "foster","friend","gate","gather","handkerchief","help","honest",
  "hypothetical","imagine","impeccable","importune","improve","independence",
  "indispensable","ineffable","irreplaceable","journey","judgmental",
  "knowledge","knowledgeable","language","look","make","member","message",
  "meticulous","misunderstood","monday","movie","nature","near","neighborhood",
  "night","notebook","notice","observe","obsolete","often","outside",
  "overwhelming","package","paradox","patient","pencil","people","perfect",
  "perseverance","plausible","play","please","popular","potato","practice",
  "pragmatic","predicament","prepare","present","protect","provide",
  "psychologist","quarantine","quickly","reason","recommendable","redundant",
  "reiterate","resilient","respect","result","rich","school","secret",
  "serious","shoes","small","sophisticated","speak","special","spontaneous",
  "spoon","sport","strong","student","subtle","suggest","talent","taxonomy",
  "teacher","think","travel","tree","unbelievable","unnecessary","useful",
  "vacation","wash","water","welcome","wisdom","yesterday"
];

// ================= VARIANTS =================
const variants = {
  "acknowledgment": ["acknowledgment","acknowledgement"],
  "judgmental": ["judgmental","judgemental"],
  "neighborhood": ["neighborhood","neighbourhood"],
  "practice": ["practice","practise"]
};

let currentWord = getRandomWord();
let recognition;

document.getElementById("word").innerText = currentWord;

// ================= RANDOM WORD =================
function getRandomWord() {
  return words[Math.floor(Math.random() * words.length)];
}

// ================= CORE COMPARISON =================
function toLetters(str) {
  return str.toLowerCase().replace(/\s+/g, "").split("");
}

function isCloseEnough(spoken, target) {
  const a = toLetters(spoken);
  const b = toLetters(target);

  if (a.length !== b.length) return false;

  const groups = [
    ["p", "b"],
    ["v", "d", "b"],
    ["t", "d"]
  ];

  function sameOrConfused(x, y) {
    if (x === y) return true;
    return groups.some(g => g.includes(x) && g.includes(y));
  }

  for (let i = 0; i < a.length; i++) {
    if (!sameOrConfused(a[i], b[i])) return false;
  }

  return true;
}

// ================= SPEECH RECOGNITION =================
function startListening() {
  recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onresult = function(event) {
    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript + " ";
    }

    transcript = transcript.toLowerCase().trim();

    document.getElementById("heard").innerText = "👂 " + transcript;

    let validList = variants[currentWord] || [currentWord];

    let isCorrect = validList.some(word =>
      isCloseEnough(transcript, word)
    );

    if (isCorrect) {
      document.getElementById("heard").innerText = "✅ Correct!";

      currentWord = getRandomWord();
      document.getElementById("word").innerText = currentWord;

      recognition.stop();
      setTimeout(startListening, 400);
    }
  };

  recognition.onerror = function(e) {
    console.log(e.error);
  };

  recognition.start();
}

// ================= RESET =================
function resetListening() {
  if (recognition) recognition.stop();

  document.getElementById("heard").innerText = "🔄 Reset...";

  setTimeout(startListening, 300);
}

// ================= START =================
startListening();

</script>

</body>
</html>
